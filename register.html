<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | Paroro</title>

<link rel="stylesheet" href="style.css">

</head>
<body class="auth-body">

<div class="auth-container">

<div class="auth-box">

<h1>Buat Akun</h1>

<p>Daftar terlebih dahulu.</p>

<form id="registerForm">

<input
type="text"
id="registerNama"
placeholder="Nama Lengkap"
required>

<input
type="email"
id="registerEmail"
placeholder="Email"
required>

<input
type="password"
id="registerPassword"
placeholder="Password"
required>

<button type="submit">

Daftar

</button>

</form>

<p>

Sudah punya akun?

<a href="login.html">

Login

</a>

</p>

</div>

</div>

<script src="auth.js"></script>
<script src="navbar.js"></script>

</body>
</html>
